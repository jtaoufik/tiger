name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails on hardcoded UI text and on any locale missing a key, with
      # different {placeholders} than English, or missing a plural form.
      - name: i18n check
        run: npm run i18n:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    # Launches the real Electron app with Playwright (npm run test:e2e). Every
    # request goes to a local server started by the suite; nothing leaves the
    # runner (the app runs with TIGER_E2E=1, which blocks non-loopback hosts).
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The accessibility audit (e2e/a11y.spec.ts) adds about 13 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which Chromium's sandbox (and so Electron) needs to start.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Every spec under e2e/ runs, including e2e/a11y.spec.ts: axe-core WCAG
      # 2.2 AA over every screen (light/dark, English/Arabic, forced colors,
      # reduced motion) and a keyboard-only journey. Any violation fails the job.
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ matrix.os }}
          path: test-results/a11y/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
