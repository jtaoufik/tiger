name: Release

# Build installers for macOS, Windows and Linux when a version tag is pushed
# (e.g. v0.4.0) and attach ONLY the installers + source code to the release.
# macOS is signed + notarized for free with an Apple Developer ID when the
# MAC_CSC_LINK / APPLE_* secrets are set; otherwise it builds unsigned.
# Windows is signed for free by SignPath Foundation once approved (docs/RELEASING.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build app + MCP server
        run: |
          npm run build
          npm run build:mcp

      # Configure macOS signing only when a certificate secret is present.
      # An empty CSC_LINK makes electron-builder fail, so when there is no cert
      # we disable signing discovery and ship an unsigned (but working) build.
      - name: Configure macOS signing
        if: matrix.os == 'macos-latest'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "Signing identity present; will sign and notarize."
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "No signing certificate; building unsigned."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      # Build the installers locally (no electron-updater metadata upload), so the
      # GitHub release stays clean: just the installers below + the source code that
      # GitHub attaches automatically. This intentionally omits latest*.yml / .blockmap
      # files, which means in-app auto-update is not served from these releases.
      - name: Package
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
