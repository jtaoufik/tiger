<!doctype html>
<!-- Renders the Tiger app icon at 1024x1024. scripts/generate-icon.sh screenshots
     this page with headless Chrome to produce build/icon.png. The cat artwork
     lives in scripts/icon-mark.svg; this file composes
     it onto the warm tile that becomes the app icon. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      .tile {
        position: absolute;
        inset: 24px;
        border-radius: 232px;
        background: linear-gradient(180deg, #fff7ec, #ffe9cf);
        box-shadow: inset 0 -14px 40px rgba(199, 85, 11, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile img {
        width: 88%;
        height: 88%;
      }
    </style>
  </head>
  <body>
    <div class="tile"><img src="icon-mark.svg" alt="" /></div>
  </body>
</html>
